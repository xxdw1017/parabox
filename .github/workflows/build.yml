name: build-windows

# 云端构建 Windows 单文件 exe（本地是 Mac 时的备份方案）
# 用法：push 到 main → 仓库 Actions → 选最新一次运行 → 下载 RecursiveBox-windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    env:
      # 跑测试与自检都不需要真实显示器/声卡
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame==2.6.1 pyinstaller

      - name: 单元测试
        run: python -m unittest discover tests -v

      - name: 打包并自检产物
        run: python tools/build_app.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: RecursiveBox-windows
          path: dist/RecursiveBox.exe
          if-no-files-found: error
          retention-days: 90
